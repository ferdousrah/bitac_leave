# BITAC Leave System — Docker Compose
# Use for local container testing OR as Coolify service template.
#
# Quick start:
#   1. Copy .env.example → .env and fill values
#   2. docker compose up -d
#   3. First-time: import initial DB dump (see DEPLOY.md)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bitac-leave:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-bitac}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-bitac_leave}
      APP_BASE_URL: ${APP_BASE_URL:-}
      APP_PROTOCOL: ${APP_PROTOCOL:-https}
    volumes:
      # Persist uploads (attachments) across deploys
      - bitac_uploads:/var/www/html/uploads
      # Persist sessions across container restarts
      - bitac_sessions:/var/www/html/sessions
      # Persist logo / favicon uploaded by super admin
      - bitac_brand:/var/www/html/app-assets/img/branding
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-bitac_leave}
      MARIADB_USER: ${DB_USER:-bitac}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bitac_db:/var/lib/mysql
      # Auto-import schema + seed on first boot (drop SQL files in ./db-init/)
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bitac_uploads:
  bitac_sessions:
  bitac_brand:
  bitac_db:
