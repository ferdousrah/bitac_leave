# BITAC Leave System — Docker Compose
# Use for local container testing OR as Coolify service template.
#
# Quick start:
#   1. Copy .env.example → .env and fill values
#   2. docker compose up -d
#   3. First-time: import initial DB dump (see DEPLOY.md)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bitac-leave:latest
    restart: unless-stopped
    # Coolify's Traefik proxy handles external routing via domain labels — we
    # only need to `expose` the internal Apache port so the proxy can reach it.
    # Do NOT use `ports:` here or it'll clash with Traefik on host :80.
    # For plain local `docker compose up` use `docker compose --profile local up`
    # or map manually.
    expose:
      - "80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-bitac}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-bitac_leave}
      APP_BASE_URL: ${APP_BASE_URL:-}
      APP_PROTOCOL: ${APP_PROTOCOL:-https}
    volumes:
      # Persist uploads (attachments) across deploys
      - bitac_uploads:/var/www/html/uploads
      # Persist sessions across container restarts
      - bitac_sessions:/var/www/html/sessions
      # Persist logo / favicon uploaded by super admin
      - bitac_brand:/var/www/html/app-assets/img/branding
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-bitac_leave}
      MARIADB_USER: ${DB_USER:-bitac}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bitac_db:/var/lib/mysql
      # Auto-import schema + seed on first boot (drop SQL files in ./db-init/)
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # mariadb-admin ping is the most portable way to check DB readiness across
      # MariaDB versions. start_period gives the container time to initialize
      # (create root user, DB, grant privileges) before healthchecks count.
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  phpmyadmin:
    # Web-based DB admin — use for schema import, ad-hoc queries, and quick
    # inspection. Restrict access with a strong password / IP allowlist in
    # production (Coolify → Application → Settings → Basic Auth is easiest).
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # Increase upload cap so a full bitac_leave dump imports in one shot.
      UPLOAD_LIMIT: 256M
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bitac_uploads:
  bitac_sessions:
  bitac_brand:
  bitac_db:
